name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON
        run: |
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool plugins/namoid-setup-assistant/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/namoid-setup-assistant/.mcp.json >/dev/null
      - name: Validate public repository boundaries
        run: |
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          ! find . -path ./.git -prune -o -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '.env.*' \) -print | grep .
          ! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AWS_SECRET_ACCESS_KEY=|sk_live_[A-Za-z0-9])' -- . ':(exclude).github/workflows/validate.yml'
